<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C4161C">
<title>Mietix Zahlen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--rot:#C4161C;--text:#1C1C1E;--rand:#E5E5EA;--grau:#8E8E93;--bg:#F2F2F7;--gruen:#1B8A4B;--hell:#FDECEC;--gelb:#B7791F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.35}
header{background:#fff;border-bottom:3px solid var(--rot);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;font-weight:700;letter-spacing:.5px}header h1 span{color:var(--rot)}
main{max-width:680px;margin:0 auto;padding:14px 16px 90px}
.karte{background:#fff;border-radius:12px;padding:16px 14px;margin-bottom:22px;border:0}
.karte h2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:10px}
.leise{font-size:13px;color:var(--grau);line-height:1.4}
/* Oben: der Monat in einer Zahl */
.held .monat{font-size:13px;font-weight:600;color:var(--grau)}
.held .gross{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums}
.held .vgl{font-size:15px;font-weight:600}
.hoch{color:var(--gruen)}.runter{color:var(--rot)}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kach{background:var(--bg);border-radius:10px;padding:10px}
.kach b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kach i{font-style:normal;font-size:12px;color:var(--grau);font-weight:700}
/* Tempo-Balken */
.tempo{height:14px;border-radius:999px;background:#EFEFF1;overflow:hidden;margin:10px 0 6px;position:relative}
.tempo i{display:block;height:100%;border-radius:999px;background:var(--gruen)}
.tempo i.rot{background:var(--rot)}
/* Monate */
.monate{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:6px}
.mo{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mo .bs{display:flex;align-items:flex-end;gap:3px;height:150px;width:100%;justify-content:center}
.mo .b{width:42%;border-radius:6px 6px 2px 2px;background:var(--gruen);position:relative;min-height:2px}
.mo .b.r{background:#C9C9CE}
.mo .t{font-size:12px;font-weight:600;margin-top:6px}
.mo .p{font-size:11px;font-weight:600;margin-top:1px}
.mo.jetzt .t{color:var(--rot)}
.legende{display:flex;gap:14px;font-size:12px;color:var(--grau);font-weight:700;margin-top:10px}
.legende span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--gruen)}
.legende span.r::before{background:#C9C9CE}
/* Zeilen mit Balken */
.zeile{margin:12px 0}
.zeile .kopf{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.zeile .kopf i{font-style:normal;font-size:13px;color:var(--grau);font-weight:700;white-space:nowrap}
.balken{height:12px;border-radius:999px;background:#EFEFF1;margin-top:6px;position:relative;overflow:visible}
.balken i{display:block;height:100%;border-radius:999px;background:var(--gruen)}
.balken i.rot{background:var(--rot)}.balken i.grau{background:#9A9AA0}
.balken u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px}
.marke{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.marke.g{background:#E8F6EE;color:var(--gruen)}.marke.r{background:var(--hell);color:var(--rot)}
/* Stamm */
.stamm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.top{margin-top:12px}
.top div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--rand);font-weight:700}
.top div span:last-child{color:var(--grau);font-weight:700;font-size:14px}
/* Daran arbeiten */
.tipp{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--rand);font-size:15px;line-height:1.35}
.tipp:first-of-type{border-top:0}
.tipp>b{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:var(--rot)}
.tipp.gut>b{background:var(--gruen)}
.leer{text-align:center;padding:30px 10px;color:var(--grau);font-weight:600}
</style></head><body>
<header><h1>MIETIX <span>ZAHLEN</span></h1></header>
<main>
<div id="abgleich"></div>
<div id="inhalt"><div class="leer">Zahlen werden geladen …</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const eur=n=>Math.round(n||0).toLocaleString("de-DE")+" €";
const kurz=n=>{n=Math.round(n||0);return Math.abs(n)>=10000?(n/1000).toLocaleString("de-DE",{maximumFractionDigits:0})+"k":Math.abs(n)>=1000?(n/1000).toLocaleString("de-DE",{maximumFractionDigits:1})+"k":String(n)};
const autoKurz=n=>String(n||"").replace("Mercedes-Benz ","").replace("Mercedes ","").replace(" Limousine","").replace(" performance","").replace(" Chauffeur-Paket","").replace("VW ","").replace(" Clubsport","");
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const pz=(a,b)=>b?Math.round((a-b)/Math.abs(b)*100):null;

function zeichne(){const S=(lies("mietixStand",{})||{}).statistik;
  if(!S||!S.monate||!S.monate.length){$("inhalt").innerHTML='<div class="karte leer">Noch keine Zahlen da.<br><br>Sie kommen aus der Excel, sobald der Mac im Büro läuft und du hier angemeldet bist.</div>';return}
  const M=S.monate,jetzt=M[M.length-1],vor=M.length>1?M[M.length-2]:null,h=new Date();
  const tageMonat=new Date(h.getFullYear(),h.getMonth()+1,0).getDate(),tag=jetzt.m===h.toISOString().slice(0,7)?h.getDate():tageMonat;
  const gewinn=jetzt.rein-jetzt.raus,hoch=Math.round(jetzt.rein/tag*tageMonat);
  // Vergleich mit demselben Zeitraum im Vormonat (1. bis heute), sonst erschreckt am Monatsanfang ein großes Minus
  const V=S.vergleich,fair=V&&vor&&V.vormonat===vor.name&&tag<tageMonat;
  const d=pz(jetzt.rein,fair?V.vormonatBisTag:(vor&&vor.rein));
  const unterwegs=lies("mietixVorgaenge",[]).filter(v=>v.status!=="zurück"&&v.vonD&&v.bisD&&v.vonD<=h.toISOString().slice(0,10)&&v.bisD>=h.toISOString().slice(0,10)).length;
  let html="";

  // 1. Der Monat in einer Zahl
  html+='<div class="karte held"><div class="monat">'+jetzt.name+' bis jetzt</div><div class="gross">'+eur(jetzt.rein)+'</div>'+
    (d!=null&&vor?'<div class="vgl '+(d>=0?"hoch":"runter")+'">'+(d>=0?"▲ ":"▼ ")+Math.abs(d)+' % gegenüber '+(fair?'1. bis '+V.tag+'. '+vor.name+' ('+eur(V.vormonatBisTag)+')':vor.name+' ('+eur(vor.rein)+')')+'</div>':"")+
    '<div class="drei"><div class="kach"><b class="'+(gewinn>=0?"hoch":"runter")+'">'+eur(gewinn)+'</b><i>Ergebnis '+jetzt.name+' (rein minus raus)</i></div>'+
    '<div class="kach"><b>'+jetzt.mieten+'</b><i>Mieten bezahlt</i></div><div class="kach"><b>'+unterwegs+'</b><i>Autos gerade unterwegs</i></div></div></div>';

  // 2. Reicht es? Fixkosten gegen Tempo
  if(S.fix&&S.fix.gesamt){const proTag=Math.round(jetzt.rein/tag),noetig=S.fix.proTag,ok=proTag>=noetig,anteil=Math.min(100,Math.round(proTag/noetig*100));
    html+='<div class="karte"><h2>Reicht es diesen Monat?</h2>'+
      '<div style="font-size:18px;font-weight:700">'+(ok?'Ja. Wir verdienen '+eur(proTag)+' pro Tag.':'Noch nicht. Bisher '+eur(proTag)+' pro Tag.')+'</div>'+
      '<div class="tempo"><i class="'+(ok?"":"rot")+'" style="width:'+anteil+'%"></i></div>'+
      '<div class="leise">Damit alle Fixkosten ('+eur(S.fix.gesamt)+' im Monat) drin sind, brauchen wir '+eur(noetig)+' pro Tag. '+
      (tag<tageMonat?'Wenn es so weitergeht, kommen bis Monatsende etwa <b>'+eur(hoch)+'</b> rein'+(hoch<S.fix.gesamt?', es fehlen also noch rund <b class="runter">'+eur(S.fix.gesamt-hoch)+'</b>. Gas geben.':'. Das reicht.'):"")+'</div></div>'}

  // 3. Die Monate im Vergleich
  const max=Math.max(1,...M.map(m=>Math.max(m.rein,m.raus)));
  html+='<div class="karte"><h2>Rein und raus je Monat</h2><div class="monate">'+M.map(m=>'<div class="mo'+(m===jetzt?" jetzt":"")+'"><div class="bs">'+
      '<div class="b" style="height:'+Math.round(m.rein/max*100)+'%" title="'+eur(m.rein)+'"></div><div class="b r" style="height:'+Math.round(m.raus/max*100)+'%" title="'+eur(m.raus)+'"></div></div>'+
      '<div class="t">'+m.name.slice(0,3)+'</div><div class="p '+(m.rein-m.raus>=0?"hoch":"runter")+'">'+(m.rein-m.raus>=0?"+":"")+kurz(m.rein-m.raus)+'</div></div>').join("")+'</div>'+
    '<div class="legende"><span>rein</span><span class="r">raus</span><span style="margin-left:auto">unten: was übrig blieb</span></div>'+
    (M.some(m=>m.anschaffung)?'<div class="leise" style="margin-top:8px">Autokauf-Anzahlungen zählen hier nicht mit ('+M.filter(m=>m.anschaffung).map(m=>m.name+" "+eur(m.anschaffung)).join(", ")+'). Das ist eine Anschaffung, keine laufende Ausgabe.</div>':"")+'</div>';

  // 4. Welches Auto verdient?
  const A=(S.autos||[]).filter(a=>a.mieten||a.fix);
  if(A.length){const amax=Math.max(1,...A.map(a=>Math.max(a.schnitt,a.fix)));
    html+='<div class="karte"><h2>Welches Auto verdient?</h2><div class="leise">Miete im Schnitt pro Monat (letzte 3 Monate). Der schwarze Strich sind die Fixkosten des Autos.</div>'+
      A.map(a=>{const ok=a.schnitt>=a.fix;return'<div class="zeile"><div class="kopf"><span>'+esc(autoKurz(a.name))+(a.fix?'<span class="marke '+(ok?"g":"r")+'">'+(ok?"trägt sich":"trägt sich nicht")+'</span>':"")+'</span><i>'+eur(a.schnitt)+'</i></div>'+
        '<div class="balken"><i class="'+(ok?"":"rot")+'" style="width:'+Math.round(a.schnitt/amax*100)+'%"></i>'+(a.fix?'<u style="left:'+Math.min(99,Math.round(a.fix/amax*100))+'%"></u>':"")+'</div>'+
        '<div class="leise" style="margin-top:4px">'+a.mieten+' Mieten insgesamt, diesen Monat '+eur(a.monat)+(a.fix?', Fixkosten '+eur(a.fix)+' im Monat':"")+'</div></div>'}).join("")+'</div>'}

  // 5. Unser Stamm
  const K=S.kunden||{};
  if(K.gesamt){html+='<div class="karte"><h2>Unser Stamm</h2><div class="stamm"><div class="kach"><b>'+K.gesamt+'</b><i>Kunden insgesamt</i></div>'+
      '<div class="kach"><b class="hoch">'+K.stamm+'</b><i>kommen wieder</i></div><div class="kach"><b>'+K.neuMonat+'</b><i>neu im '+jetzt.name+'</i></div></div>'+
      '<div class="tempo" style="margin-top:12px"><i style="width:'+Math.round(K.stamm/K.gesamt*100)+'%"></i></div><div class="leise">'+Math.round(K.stamm/K.gesamt*100)+' % unserer Kunden haben mehr als einmal gemietet.</div>'+
      (K.top&&K.top.length?'<div class="top">'+K.top.map((k,i)=>'<div><span>'+(i+1)+'. '+esc(k.name)+'</span><span>'+k.mieten+'× gemietet, '+eur(k.umsatz)+'</span></div>').join("")+'</div>':"")+'</div>'}

  // 6. Wohin geht das Geld?
  const G=(S.ausgaben||[]).slice(0,7);
  if(G.length){const gmax=Math.max(1,...G.map(g=>g.b)),summe=(S.ausgaben||[]).reduce((s,g)=>s+g.b,0);
    html+='<div class="karte"><h2>Wohin geht das Geld?</h2><div class="leise">Ausgaben der letzten 3 Monate zusammen: '+eur(summe)+'</div>'+
      G.map(g=>'<div class="zeile"><div class="kopf"><span>'+esc(g.art)+'</span><i>'+eur(g.b)+' ('+Math.round(g.b/summe*100)+' %)</i></div><div class="balken"><i class="grau" style="width:'+Math.round(g.b/gmax*100)+'%"></i></div></div>').join("")+'</div>'}

  // 7. Daran arbeiten (und was gut läuft)
  const tipps=[];
  if(S.fix&&S.fix.gesamt&&tag<tageMonat&&hoch<S.fix.gesamt)tipps.push([0,'Bis Monatsende fehlen rund <b>'+eur(S.fix.gesamt-hoch)+'</b> bis die Fixkosten drin sind. Freie Autos am Wochenende an Stammkunden anbieten (Kunden, Angebot verschicken).']);
  A.filter(a=>a.fix&&a.schnitt<a.fix).sort((x,y)=>(x.schnitt-x.fix)-(y.schnitt-y.fix)).slice(0,2).forEach(a=>tipps.push([0,'<b>'+esc(autoKurz(a.name))+'</b> bringt im Schnitt '+eur(a.schnitt)+' im Monat, kostet aber '+eur(a.fix)+'. Öfter anbieten oder über Verkauf nachdenken.']));
  const so=(S.ausgaben||[]).find(g=>g.art==="Sonstiges"),gs=(S.ausgaben||[]).reduce((s,g)=>s+g.b,0);
  if(so&&gs&&so.b/gs>.25)tipps.push([0,'<b>'+Math.round(so.b/gs*100)+' %</b> der Ausgaben stehen unter „Sonstiges“. In der Excel genauer zuordnen, dann sehen wir, wo das Geld wirklich hingeht.']);
  if(K.stammLange)tipps.push([0,'<b>'+K.stammLange+' Stammkunden</b> waren seit über 2 Monaten nicht da. Kurz anschreiben (Kunden, Lange nicht da).']);
  if(S.schaeden&&S.schaeden.offen)tipps.push([0,'Aus Schäden sind noch <b>'+eur(S.schaeden.offen)+'</b> offen ('+S.schaeden.faelle+' Fälle). Nachhaken (Excel, Reiter Schäden).']);
  if(A.length&&A[0].schnitt)tipps.push([1,'Bestes Auto: <b>'+esc(autoKurz(A[0].name))+'</b> mit '+eur(A[0].schnitt)+' im Monat.']);
  if(K.top&&K.top[0])tipps.push([1,'Treuester Kunde: <b>'+esc(K.top[0].name)+'</b>, '+K.top[0].mieten+'× gemietet.']);
  if(d!=null&&d>0)tipps.push([1,'Mehr Umsatz als im '+vor.name+': <b>+'+d+' %</b>.']);
  html+='<div class="karte"><h2>Daran arbeiten</h2>'+tipps.map(([gut,t])=>'<div class="tipp'+(gut?" gut":"")+'"><b>'+(gut?"✓":"!")+'</b><span>'+t+'</span></div>').join("")+'</div>';

  html+='<div class="leise" style="text-align:center">Zahlen aus der Excel, Stand '+new Date(S.stand).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+' Uhr. Miete zählt, sobald sie bezahlt ist.</div>';
  $("inhalt").innerHTML=html}
zeichne();
window.addEventListener("mietix-abgleich",zeichne);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)zeichne()});
</script>
<script>/* Mietix Abgleich: Mietverträge, Anfragen, Kunden und Fahrzeuge auf allen Geräten gleich (Supabase Frankfurt, seit 26.10.2026).
   Wird von tools/vertrag/build_html.py und tools/anfragen/build_html.py in die Seite eingebaut.
   - Die Werkzeuge arbeiten weiter nur mit localStorage. Dieser Baustein merkt jede Änderung an den vier Speichern,
     schickt sie hoch und holt neue Stände der anderen Geräte (beim Start, beim Zurückkehren zur Seite, jede Minute).
   - Ohne Internet oder ohne Anmeldung läuft alles wie vorher, der Abgleich holt später nach.
   - Gelöschte Einträge (Anfragen-Buch) gehen als {_weg:true} hoch, damit sie auch auf den anderen Geräten verschwinden.
   - Anmeldung: E-Mail und Passwort, einmal pro Gerät. Gilt für alle Mietix-Werkzeuge auf barankohler.github.io. */
(function(){
const URL_="https://zbeqrwvlmiulxvhryiku.supabase.co";
const KEY="sb_publishable_LVkvpgXMpBbq_OXgwOfTqg_ZRcRkFyQ";   // öffentlich gedacht, Schutz über Anmeldung und Regeln in der Datenbank
const SPEICHER={mietixVorgaenge:{tab:"vorgaenge",pk:"nr",liste:true},mietixAnfragen:{tab:"anfragen",pk:"id",liste:true},
  mietixKunden:{tab:"kunden",pk:"name",liste:false},mietixFahrzeuge:{tab:"fahrzeuge",pk:"name",liste:false},
  mietixAusgaben:{tab:"ausgaben",pk:"id",liste:true},mietixSperren:{tab:"sperren",pk:"id",liste:true},
  mietixAufgaben:{tab:"aufgaben",pk:"id",liste:true},mietixZustand:{tab:"zustand",pk:"id",liste:true},mietixAutos:{tab:"autos",pk:"name",liste:false},mietixStand:{tab:"stand",pk:"id",liste:false},mietixPapierkorb:{tab:"papierkorb",pk:"id",liste:true}};
const roh=Storage.prototype.setItem;
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const merk=(k,v)=>{try{roh.call(localStorage,k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
let sitzung=lies("mietixSitzung",null),laeuft=false,nochmal=false,zuletzt=null,fehler="";

/* ---------- Anmeldung ---------- */
async function auth(pfad,body){const r=await fetch(URL_+"/auth/v1/"+pfad,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||"Anmeldung fehlgeschlagen");e.status=r.status;throw e}return j}
function sichern(j){sitzung={token:j.access_token,neu:j.refresh_token,bis:Date.now()+(j.expires_in||3600)*1000-60000,
  email:(j.user&&j.user.email)||(sitzung&&sitzung.email)||""};merk("mietixSitzung",sitzung)}
async function token(){if(!sitzung)return null;
  if(Date.now()>sitzung.bis){try{sichern(await auth("token?grant_type=refresh_token",{refresh_token:sitzung.neu}))}
    // Abmelden nur, wenn der Speicher die Anmeldung wirklich ablehnt, nicht bei schlechtem Netz (30.10.2026)
    catch(e){if(e.status>=400&&e.status<500){sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}return null}}
  return sitzung.token}
async function api(pfad,opt){const t=await token();if(!t)throw new Error("nicht angemeldet");
  const r=await fetch(URL_+"/rest/v1/"+pfad,Object.assign({},opt,{headers:Object.assign({apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},(opt||{}).headers||{})}));
  if(!r.ok)throw new Error("Speicher antwortet "+r.status);const s=await r.text();return s?JSON.parse(s):null}

/* ---------- Abgleich ---------- */
function alsMap(k,w){const c=SPEICHER[k],m={};if(c.liste)(w||[]).forEach(x=>{if(x&&x[c.pk]!==undefined)m[String(x[c.pk])]=x});else Object.assign(m,w||{});return m}
function ausMap(k,m){const c=SPEICHER[k];if(!c.liste)return m;return Object.keys(m).sort().map(p=>m[p])}
/* Zusammenführen statt Überschreiben (30.10.2026, Nachtschicht):
   - Erst holen, dann schicken. So kennt jedes Gerät den neuesten Stand, bevor es seinen eigenen hochlädt.
   - Je Eintrag merkt sich das Gerät, wie er beim letzten Abgleich aussah (Fingerabdruck je Feld).
     Haben beide Geräte verschiedene Felder geändert, kommen beide Änderungen zusammen.
   - Haben beide dasselbe Feld verschieden geändert, bleibt die Fassung dieses Geräts stehen und die andere
     Fassung liegt im Papierkorb ("Andere Fassung"), dort kann man sie wiederherstellen. Nichts verschwindet still.
   - Geändert schlägt Gelöscht: wird ein Eintrag hier geändert und dort gelöscht, bleibt er da.
   - Beim Holen wird zwei Minuten überlappend gefragt, damit kein Eintrag wegen ungleich gehender Uhren fehlt. */
const UEBERLAPPUNG=2*60*1000;
const FELDWEISE={mietixVorgaenge:1,mietixAnfragen:1,mietixKunden:1,mietixFahrzeuge:1,mietixAutos:1};
// Inhalt unabhängig von der Reihenfolge der Felder (die Datenbank sortiert Felder um)
const ordne=x=>Array.isArray(x)?x.map(ordne):x&&typeof x==="object"?Object.keys(x).sort().reduce((o,n)=>{o[n]=ordne(x[n]);return o},{}):x;
const fp=x=>hash(JSON.stringify(ordne(x))===undefined?"":JSON.stringify(ordne(x)));
// Fingerabdruck stimmt mit der Grundlage überein (neue Form oder die Form vor dem 30.10.2026)
const gleichBasis=(x,b)=>b!==undefined&&(fp(x)===b||hash(JSON.stringify(x))===b);
const felderVon=x=>{const f={};if(x&&typeof x==="object"&&!Array.isArray(x))Object.keys(x).forEach(n=>f[n]=fp(x[n]));return f};
function andereFassung(k,p,eintrag){if(k==="mietixPapierkorb"||k==="mietixStand")return;
