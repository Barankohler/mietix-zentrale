<style>
:root{--rot:#C4161C;--text:#1C1C1E;--rand:#E5E5EA;--grau:#8E8E93;--bg:#F2F2F7;--gruen:#1B8A4B;--hell:#FDECEC;--gelb:#B7791F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.35}

.karte{background:#fff;border-radius:12px;padding:16px 14px;margin-bottom:22px;border:0}
.karte h2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:10px}
.leise{font-size:13px;color:var(--grau);line-height:1.4}

.held .monat{font-size:13px;font-weight:600;color:var(--grau)}
.held .gross{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums}
.held .vgl{font-size:15px;font-weight:600}
.hoch{color:var(--gruen)}.runter{color:var(--rot)}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kach{background:var(--bg);border-radius:10px;padding:10px}
.kach b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kach i{font-style:normal;font-size:12px;color:var(--grau);font-weight:700}
/* Tempo-Balken */
.tempo{height:14px;border-radius:999px;background:#EFEFF1;overflow:hidden;margin:10px 0 6px;position:relative}
.tempo i{display:block;height:100%;border-radius:999px;background:var(--gruen)}
.tempo i.rot{background:var(--rot)}
/* Monate */
.monate{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:6px}
.mo{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mo .bs{display:flex;align-items:flex-end;gap:3px;height:150px;width:100%;justify-content:center}
.mo .b{width:42%;border-radius:6px 6px 2px 2px;background:var(--gruen);position:relative;min-height:2px}
.mo .b.r{background:#C9C9CE}
.mo .t{font-size:12px;font-weight:600;margin-top:6px}
.mo .p{font-size:11px;font-weight:600;margin-top:1px}
.mo.jetzt .t{color:var(--rot)}
.legende{display:flex;gap:14px;font-size:12px;color:var(--grau);font-weight:700;margin-top:10px}
.legende span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--gruen)}
.legende span.r::before{background:#C9C9CE}
/* Zeilen mit Balken */
.zeile{margin:12px 0}
.zeile .kopf{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.zeile .kopf i{font-style:normal;font-size:13px;color:var(--grau);font-weight:700;white-space:nowrap}
.balken{height:12px;border-radius:999px;background:#EFEFF1;margin-top:6px;position:relative;overflow:visible}
.balken i{display:block;height:100%;border-radius:999px;background:var(--gruen)}
.balken i.rot{background:var(--rot)}.balken i.grau{background:#9A9AA0}
.balken u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px}
.marke{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.marke.g{background:#E8F6EE;color:var(--gruen)}.marke.r{background:var(--hell);color:var(--rot)}
/* Stamm */
.stamm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.top{margin-top:12px}
.top div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--rand);font-weight:700}
.top div span:last-child{color:var(--grau);font-weight:700;font-size:14px}

.tipp{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--rand);font-size:15px;line-height:1.35}
.tipp:first-of-type{border-top:0}
.tipp>b{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:var(--rot)}
.tipp.gut>b{background:var(--gruen)}
.leer{text-align:center;padding:30px 10px;color:var(--grau);font-weight:600}
/* Umsatz-Karte (seit 12.11.2026 hier statt auf der Startseite, Baran: nicht auf der ersten Seite). Aussehen wie bisher auf der Startseite */
.um{display:block;background:#1C1C1E;color:#fff;border-radius:20px;padding:16px 16px 14px;margin-bottom:12px;text-decoration:none}
.umz{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.umt{font-size:12px;font-weight:800;letter-spacing:.8px;color:#A1A1A6;text-transform:uppercase}.umm{font-size:14px;font-weight:700;color:#D1D1D6;white-space:nowrap}
.umg{display:block;font-size:40px;font-weight:800;letter-spacing:-1px;margin-top:2px;font-variant-numeric:tabular-nums}
.umb{position:relative;display:block;height:14px;background:#3A3A3C;border-radius:7px;margin:12px 0 6px}
.umv{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#C4161C,#FF5A5F);border-radius:7px;transition:width .6s ease}.umv.gut{background:linear-gradient(90deg,#1E9E5A,#4CD38A)}
.umf{position:absolute;right:0;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px}
.umu{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#A1A1A6;font-weight:600}.umu b{color:#fff}
.umzl{display:grid;gap:7px;margin-top:12px;border-top:1px solid #3A3A3C;padding-top:10px;font-size:14px;font-weight:600;color:#D1D1D6}
.umzl>span{display:flex;justify-content:space-between;gap:8px}.umzl b{color:#fff;white-space:nowrap}.umzl .neg{color:#FF6B6B}.umzl .pos{color:#4CD38A}
.um{border-radius:18px}.um.versteckt{display:none}
@media(max-width:360px){.umg{font-size:34px}}

    if(m){s=m[1].trim().replace(/,$/,"");p=m[2];o=m[3].trim()}else if(voll&&/\d/.test(v))s=v;else o=v.replace(/^,\s*/,"");return{s,p,o}}   // ohne Hausnummer ist es ein Ort (31.10.2026)
  function setzen(inp){if(inp.dataset.mxA)return;inp.dataset.mxA="1";const voll=inp.dataset.anschrift!=="plzort";
    const lab=inp.previousElementSibling&&inp.previousElementSibling.tagName==="LABEL"?inp.previousElementSibling:null;
    const ic=inp.className,lc=lab?lab.className:"",feld=(t,l,extra)=>lab?'<label class="'+lc+'">'+l+'</label><input class="'+ic+'" data-t="'+t+'" autocomplete="off"'+(extra||"")+'>':'<input class="'+ic+'" data-t="'+t+'" placeholder="'+l+'" autocomplete="off"'+(extra||"")+'>';
    const w=document.createElement("div");w.className="mxAnschr";
    w.innerHTML=(voll?feld("s","Straße und Hausnummer"):"")+'<div class="mxAZ"><div>'+feld("p","PLZ",' inputmode="numeric" maxlength="5"')+'</div><div>'+feld("o","Wohnort")+'</div></div>';
    inp.after(w);inp.style.display="none";if(lab)lab.style.display="none";
    const f=t=>w.querySelector('[data-t="'+t+'"]');
    const verteilen=v=>{const x=teile(v,voll);if(f("s"))desc.set.call(f("s"),x.s);desc.set.call(f("p"),x.p);desc.set.call(f("o"),x.o)};
    const zusammen=()=>{const s=f("s")?desc.get.call(f("s")).trim():"",p=desc.get.call(f("p")).trim(),o=desc.get.call(f("o")).trim(),po=(p+" "+o).trim();return voll?[s,po].filter(Boolean).join(", "):po};
    Object.defineProperty(inp,"value",{configurable:true,get(){return desc.get.call(this)},set(v){desc.set.call(this,v);verteilen(v)}});
    verteilen(desc.get.call(inp));
    w.querySelectorAll("input").forEach(e=>e.addEventListener("input",()=>{desc.set.call(inp,zusammen());inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}))}))}
  window.mxAnschrift=setzen;
  const alle=w=>(w||document).querySelectorAll("input[data-anschrift]").forEach(setzen);alle();
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){if(n.matches&&n.matches("input[data-anschrift]"))setzen(n);else if(n.querySelectorAll)alle(n)}}).observe(document.body,{childList:true,subtree:true})})();
</script></body></html>
