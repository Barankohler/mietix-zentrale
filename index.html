<style>
input,select,textarea{font-size:16px;font-family:inherit;max-width:100%;box-sizing:border-box}input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:44px}select{min-width:0}

:root{--rot:#C4161C;--ink:#1C1C1E;--grau:#8A8A8E;--linie:#ECECEF;--bg:#F4F4F6;--gruen:#1E9E5A;--gelb:#9A6700;--gelbbg:#FFF4DB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.3;-webkit-text-size-adjust:100%}
.app{max-width:430px;margin:0 auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 4px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:28px;font-weight:900;letter-spacing:-.5px}header h1 span{color:var(--rot)}
#punkt{width:14px;height:14px;border-radius:50%;background:#B0B0B3;cursor:pointer;box-shadow:0 0 0 4px #fff}
#punkt.gruen{background:var(--gruen)}#punkt.rot{background:var(--rot)}
#stand{display:none;margin-bottom:10px}#stand.auf{display:block}
h2{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--grau);margin:16px 4px 8px}
.k{background:#fff;border-radius:20px;padding:4px 16px;margin-bottom:10px}
.z{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--linie);text-decoration:none;color:var(--ink)}
.z:first-child{border-top:0}
.z .uhr{min-width:48px;font-size:15px;font-weight:800}
.z .t{flex:1;min-width:0}.z b{display:block;font-size:17px;font-weight:700}.z i{font-style:normal;font-size:14px;color:var(--grau)}
.chip{display:inline-block;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--bg);color:var(--ink);white-space:nowrap}
.chip.rot{background:#FDECEC;color:var(--rot)}.chip.gruen{background:#E6F6EC;color:var(--gruen)}.chip.gelb{background:var(--gelbbg);color:var(--gelb)}
.leer{padding:18px 0;color:var(--grau);font-weight:600;text-align:center}

.kachel:active{background:#F0F0F2}
.kachel svg{display:block;width:34px;height:34px;margin:0 auto 10px;stroke:var(--rot);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kachel .zahl{position:absolute;top:10px;right:10px;background:var(--rot);color:#fff;border-radius:999px;font-size:12px;padding:2px 7px}
.versteckt{display:none!important}

.tipp{font-size:12px;color:var(--grau);text-align:center;margin-top:14px;line-height:1.5}
</style></head><body><div class="app">
<header><h1>Mietix<span>.</span></h1><span id="punkt" title="Anmeldung und Stand"></span></header>
<div id="stand"><div id="abgleich"></div><div id="bruecke" class="tipp" style="text-align:left;margin:0 4px 6px"></div></div>

<div class="kacheln" style="margin-top:6px"><a class="kachel" href="https://barankohler.github.io/mietix-anfragen/" data-zaehler="anfragen"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Anfragen</a><a class="kachel" href="https://barankohler.github.io/mietix-belegung/"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</a><a class="kachel" href="https://barankohler.github.io/mietix-belegung/?zeige=angebot"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h3M13 12h3M8 16h3M13 16h3"/></svg>Angebot</a><a class="kachel" href="https://barankohler.github.io/mietix-vertrag/" data-zaehler="vertraege"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Verträge</a><a class="kachel" href="https://barankohler.github.io/mietix-zentrale/kunden.html"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Kunden</a><a class="kachel" href="https://barankohler.github.io/mietix-autos/" data-zaehler="autos"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><path d="M3 13l2-5h14l2 5v5H3z"/><circle cx="7.5" cy="16" r="1.5"/><circle cx="16.5" cy="16" r="1.5"/></svg>Autos</a><a class="kachel" href="https://barankohler.github.io/mietix-geld/"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>Geld</a><a class="kachel" href="https://barankohler.github.io/mietix-schadensabrechnung/" data-zaehler="schaeden"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h0"/></svg>Schäden</a><a class="kachel" href="https://barankohler.github.io/mietix-zentrale/nachrichten.html"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Nachrichten</a><a class="kachel" href="https://barankohler.github.io/mietix-story/"><span class="zahl versteckt"></span><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 17l3-4 2 2 3-4"/></svg>Story</a></div>

<h2 id="heuteTitel">Heute</h2>
<div class="k" id="heute"><div class="leer">Heute keine Übergabe und keine Rückgabe.</div></div>

<div class="unten"><a href="papierkorb.html">Papierkorb</a><a href="einstellungen.html">Einstellungen</a></div>
<div class="tipp" id="homeTipp">Zum Startbildschirm: unten Teilen, dann „Zum Home-Bildschirm“.</div>
</div>
<script>
(function(){
  const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
  const uhrDe=(z,mitTag)=>{const d=new Date(z),p=n=>String(n).padStart(2,"0");return (mitTag?p(d.getDate())+"."+p(d.getMonth()+1)+". ":"")+p(d.getHours())+":"+p(d.getMinutes())};
  const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const de=s=>s?String(s).slice(0,10).split("-").reverse().slice(0,2).join(".")+".":"";
  const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const B="https://barankohler.github.io/",WT=["So","Mo","Di","Mi","Do","Fr","Sa"];
  const EUR=n=>(+n||0).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";
  const zahl=v=>{if(v==null)return 0;const s=String(v).trim();if(!s)return 0;return parseFloat(s.indexOf(",")>=0?s.replace(/\./g,"").replace(",","."):s.replace(/\.(?=\d{3}(\D|$))/g,""))||0};
  if(window.navigator.standalone)document.getElementById("homeTipp").style.display="none";
  function zeile(a){return '<a class="z" href="'+a.href+'"><span class="uhr">'+(a.uhr||"&nbsp;")+'</span><span class="t"><b>'+esc(a.t)+'</b><i>'+esc(a.i)+'</i></span><span class="chip'+(a.art?" "+a.art:"")+'">'+a.k+'</span></a>'}
  function zeichne(){
    const h=new Date(),hi=iso(h),m=new Date();m.setDate(m.getDate()+1);const mo=iso(m);
    document.getElementById("heuteTitel").textContent="Heute, "+WT[h.getDay()]+" "+h.getDate()+"."+(h.getMonth()+1)+".";
    const alle=lies("mietixVorgaenge",[]),v=alle.filter(x=>x.status!=="zurück"),anf=lies("mietixAnfragen",[]),auf=lies("mietixAufgaben",[]),zust=lies("mietixZustand",[]);
    const out=[];
    const tag=d=>d<hi?"überfällig seit "+de(d):d===hi?"heute":"morgen";
    v.filter(x=>!x.ueb&&x.vonD<=mo).sort((a,b)=>(a.vonD+(a.vonU||"")).localeCompare(b.vonD+(b.vonU||""))).forEach(x=>out.push({uhr:x.vonD===hi?(x.vonU||""):"",t:x.name,i:x.auto+", Abholung "+tag(x.vonD),k:"Übergabe",art:x.vonD<hi?"rot":"",href:B+"mietix-vertrag/?nr="+encodeURIComponent(x.nr)+"&zeige=uebergabe"}));
    v.filter(x=>x.ueb&&x.bisD<=mo).sort((a,b)=>(a.bisD+(a.bisU||"")).localeCompare(b.bisD+(b.bisU||""))).forEach(x=>out.push({uhr:x.bisD===hi?(x.bisU||""):"",t:x.name,i:x.auto+", Rückgabe "+tag(x.bisD),k:"Rückgabe",art:x.bisD<hi?"rot":"",href:B+"mietix-vertrag/?nr="+encodeURIComponent(x.nr)+"&zeige=rueckgabe"}));
    const rest=[];
    alle.filter(x=>x.status==="zurück"&&((x.zahlung||{}).kaut||{}).am&&!x.kautionRueck).forEach(x=>rest.push({t:x.name,i:"Kaution "+EUR(zahl(x.zahlung.kaut.betrag))+" zurückgeben",k:"Zurück",art:"gruen",href:B+"mietix-vertrag/?zeige=heute"}));
    alle.filter(x=>x.vonD&&x.vonD<hi&&!((x.zahlung||{}).rest||{}).am&&zahl(((x.zahlung||{}).rest||{}).betrag)).forEach(x=>rest.push({t:x.name,i:EUR(zahl(x.zahlung.rest.betrag))+" Miete noch offen",k:"Erinnern",art:"rot",href:B+"mietix-vertrag/?zeige=heute"}));
    const autoPunkte=[];auf.filter(a=>!a.erledigt&&!a._weg&&a.aufgabe&&a.bis&&a.bis<=hi).forEach(a=>autoPunkte.push({t:a.aufgabe,i:a.bis<hi?"überfällig seit "+de(a.bis):"heute fällig",k:"Aufgabe",art:"gelb",href:B+"mietix-autos/?zeige=aufgaben"}));
    zust.filter(z=>!z.erledigt&&z.auto).forEach(z=>autoPunkte.push({t:z.auto,i:z.text+(z.datum?", seit "+de(z.datum):""),k:"Zustand",art:"gelb",href:B+"mietix-autos/"}));
    const sta=lies("mietixAutos",{});Object.keys(sta).forEach(n=>[["tuev","TÜV"],["service","Service"],["reifen","Reifen"]].forEach(([k,t])=>{const d=sta[n][k];if(!d)return;const tage=Math.round((new Date(String(d).slice(0,10))-new Date(hi))/864e5);
      if(tage<=14)autoPunkte.push({t:n,i:t+(tage<0?" überfällig":tage===0?" heute":" in "+tage+" Tagen"),k:t,art:tage<=7?"rot":"gelb",href:B+"mietix-autos/"})}));
    const offen=anf.filter(a=>a.status==="offen").length;
    document.getElementById("heute").innerHTML=out.length?out.map(zeile).join(""):'<div class="leer">Heute keine Übergabe und keine Rückgabe.</div>';
    // Zähler auf den Kacheln
    const kunden=lies("mietixKunden",{});let sch=0;Object.keys(kunden).forEach(n=>{if(kunden[n]&&kunden[n].schadenOffen)sch++});
    document.querySelectorAll(".kachel[data-zaehler]").forEach(k=>{const n={anfragen:offen,schaeden:sch,vertraege:rest.length,autos:autoPunkte.length}[k.dataset.zaehler]||0;const z=k.querySelector(".zahl");z.textContent=n;z.classList.toggle("versteckt",!n)});
    // Punkt: grün angemeldet, grau nicht, rot wenn die Brücke hängt
    const sitzung=lies("mietixSitzung",null),st=(lies("mietixStand",{}).bruecke)||null;let text="";
    const p=document.getElementById("punkt");p.className="";
    if(!sitzung){text=""}
    else if(st&&st.zeit){const alter=(Date.now()-new Date(st.zeit))/3600000;const rot=alter>2||st.ok===false;p.className=rot?"rot":"gruen";
      text="Excel: "+(st.ok===false?st.text:(alter>2?"zuletzt "+uhrDe(st.zeit,true)+" Uhr. Mac aus oder ohne Internet?":"aktuell bis "+uhrDe(st.zeit)+" Uhr"))}
    else{p.className="gruen";text="Angemeldet, alles gesichert."}
    document.getElementById("bruecke").textContent=text;
  }
  document.getElementById("punkt").onclick=()=>document.getElementById("stand").classList.toggle("auf");
  zeichne();
  (function(){const t=setInterval(()=>{if(window.mietixAbgleichen){clearInterval(t);zeichne();if(!lies("mietixSitzung",null))document.getElementById("stand").classList.add("auf")}},150)})();
  window.addEventListener("mietix-abgleich",zeichne);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)zeichne()});
})();
</script>
<script>/* Mietix Abgleich: Verträge, Anfragen, Kunden und Fahrzeuge auf allen Geräten gleich (Supabase Frankfurt, seit 26.10.2026).
   Wird von tools/vertrag/build_html.py und tools/anfragen/build_html.py in die Seite eingebaut.
   - Die Werkzeuge arbeiten weiter nur mit localStorage. Dieser Baustein merkt jede Änderung an den vier Speichern,
     schickt sie hoch und holt neue Stände der anderen Geräte (beim Start, beim Zurückkehren zur Seite, jede Minute).
   - Ohne Internet oder ohne Anmeldung läuft alles wie vorher, der Abgleich holt später nach.
   - Gelöschte Einträge (Anfragen-Buch) gehen als {_weg:true} hoch, damit sie auch auf den anderen Geräten verschwinden.
   - Anmeldung: E-Mail und Passwort, einmal pro Gerät. Gilt für alle Mietix-Werkzeuge auf barankohler.github.io. */
(function(){
const URL_="https://zbeqrwvlmiulxvhryiku.supabase.co";
const KEY="sb_publishable_LVkvpgXMpBbq_OXgwOfTqg_ZRcRkFyQ";   // öffentlich gedacht, Schutz über Anmeldung und Regeln in der Datenbank
const SPEICHER={mietixVorgaenge:{tab:"vorgaenge",pk:"nr",liste:true},mietixAnfragen:{tab:"anfragen",pk:"id",liste:true},
  mietixKunden:{tab:"kunden",pk:"name",liste:false},mietixFahrzeuge:{tab:"fahrzeuge",pk:"name",liste:false},
  mietixAusgaben:{tab:"ausgaben",pk:"id",liste:true},mietixSperren:{tab:"sperren",pk:"id",liste:true},
  mietixAufgaben:{tab:"aufgaben",pk:"id",liste:true},mietixZustand:{tab:"zustand",pk:"id",liste:true},mietixAutos:{tab:"autos",pk:"name",liste:false},mietixStand:{tab:"stand",pk:"id",liste:false},mietixPapierkorb:{tab:"papierkorb",pk:"id",liste:true}};
const roh=Storage.prototype.setItem;
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const merk=(k,v)=>{try{roh.call(localStorage,k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
let sitzung=lies("mietixSitzung",null),laeuft=false,nochmal=false,zuletzt=null,fehler="";

/* ---------- Anmeldung ---------- */
async function auth(pfad,body){const r=await fetch(URL_+"/auth/v1/"+pfad,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Anmeldung fehlgeschlagen");return j}
function sichern(j){sitzung={token:j.access_token,neu:j.refresh_token,bis:Date.now()+(j.expires_in||3600)*1000-60000,
  email:(j.user&&j.user.email)||(sitzung&&sitzung.email)||""};merk("mietixSitzung",sitzung)}
async function token(){if(!sitzung)return null;
  if(Date.now()>sitzung.bis){try{sichern(await auth("token?grant_type=refresh_token",{refresh_token:sitzung.neu}))}
    catch(e){if(navigator.onLine){sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}return null}}
  return sitzung.token}
async function api(pfad,opt){const t=await token();if(!t)throw new Error("nicht angemeldet");
  const r=await fetch(URL_+"/rest/v1/"+pfad,Object.assign({},opt,{headers:Object.assign({apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},(opt||{}).headers||{})}));
  if(!r.ok)throw new Error("Speicher antwortet "+r.status);const s=await r.text();return s?JSON.parse(s):null}

/* ---------- Abgleich ---------- */
function alsMap(k,w){const c=SPEICHER[k],m={};if(c.liste)(w||[]).forEach(x=>{if(x&&x[c.pk]!==undefined)m[String(x[c.pk])]=x});else Object.assign(m,w||{});return m}
function ausMap(k,m){const c=SPEICHER[k];if(!c.liste)return m;return Object.keys(m).sort().map(p=>m[p])}
async function abgleichen(){
  if(!sitzung||!navigator.onLine)return;if(laeuft){nochmal=true;return}laeuft=true;fehler="";zeigen();
  const H=lies("mietixAbgleich",{}),geholt=[];
  try{
    for(const k of Object.keys(SPEICHER)){const c=SPEICHER[k],h=H[k]=H[k]||{zeit:"",hash:{}},m=alsMap(k,lies(k,c.liste?[]:{}));
      // 1) hoch: alles, was sich hier seit dem letzten Abgleich geändert hat (auch Gelöschtes)
      const jetzt=new Date().toISOString(),hoch=[];
      Object.keys(m).forEach(p=>{const s=JSON.stringify(m[p]);if(h.hash[p]!==hash(s))hoch.push({[c.pk]:p,daten:m[p],geaendert:jetzt})});
      Object.keys(h.hash).forEach(p=>{if(!(p in m)&&h.hash[p]!=="weg")hoch.push({[c.pk]:p,daten:{_weg:true},geaendert:jetzt})});
      for(let i=0;i<hoch.length;i+=200)await api(c.tab+"?on_conflict="+c.pk,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(hoch.slice(i,i+200))});
      hoch.forEach(z=>h.hash[z[c.pk]]=z.daten._weg?"weg":hash(JSON.stringify(z.daten)));
      if(k==="mietixVorgaenge"){const max=Math.max(0,...Object.keys(m).filter(n=>/^\d{6}$/.test(n)).map(Number));
        if(max)await api("rpc/vertragsnummer_mindestens",{method:"POST",body:JSON.stringify({n:max})})}
      // 2) runter: was die anderen Geräte seit dem letzten Mal geschickt haben
      const seit=h.zeit?"&geaendert=gt."+encodeURIComponent(h.zeit):"";
      const zeilen=await api(c.tab+"?select="+c.pk+",daten,geaendert&order=geaendert.asc"+seit,{method:"GET"})||[];
      let anders=false;const m2=alsMap(k,lies(k,c.liste?[]:{}));
      zeilen.forEach(z=>{const p=String(z[c.pk]);h.zeit=z.geaendert>h.zeit?z.geaendert:h.zeit;
        if(z.daten&&z.daten._weg){if(p in m2){delete m2[p];anders=true}h.hash[p]="weg";return}
        const s=JSON.stringify(z.daten);if(!(p in m2)||JSON.stringify(m2[p])!==s){m2[p]=z.daten;anders=true}h.hash[p]=hash(s)});
      if(anders){merk(k,ausMap(k,m2));geholt.push(k)}}
    merk("mietixAbgleich",H);zuletzt=new Date();
    if(geholt.length)window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:geholt}));
  }catch(e){fehler=e.message||"Abgleich fehlgeschlagen"}
  laeuft=false;zeigen();if(nochmal){nochmal=false;setTimeout(abgleichen,500)}}
// Jede Änderung an den vier Speichern löst kurz danach einen Abgleich aus
let warte=null;
Storage.prototype.setItem=function(k,v){const alt=(this===localStorage&&SPEICHER[k])?localStorage.getItem(k):null;roh.call(this,k,v);
  if(this===localStorage&&SPEICHER[k]){clearTimeout(warte);warte=setTimeout(abgleichen,800);if(k!=="mietixStand"&&k!=="mietixPapierkorb")sicherheitsnetz(k,alt,v)}};

/* ---------- Sicherheitsnetz (28.10.2026, Baran: "Verklicken darf nichts verlieren") ----------
   1. Rückgängig: jede Änderung an einer Ablage zeigt 8 Sekunden lang einen Knopf, der den Stand davor zurückholt.
   2. Papierkorb: was aus einer Liste verschwindet, landet in mietixPapierkorb (Tabelle papierkorb, 90 Tage) und
      kann in der Zentrale wiederhergestellt werden (window.mietixWiederherstellen).
   3. Die Datenbank schreibt dazu jede Änderung in die Tabelle verlauf (SQL in tools/vertrag/speicher.sql). */
const NAMEN={mietixVorgaenge:"Vertrag",mietixAnfragen:"Anfrage",mietixKunden:"Kunde",mietixFahrzeuge:"Fahrzeug",mietixAusgaben:"Ausgabe",
  mietixSperren:"Sperre",mietixAufgaben:"Aufgabe",mietixZustand:"Zustand",mietixAutos:"Auto"};
const BESCHRIFTUNG={mietixVorgaenge:x=>"Vertrag "+(x.nr||"")+" "+(x.name||""),mietixAnfragen:x=>"Anfrage "+(x.name||"")+(x.auto?", "+x.auto:""),
  mietixAusgaben:x=>"Ausgabe "+(x.betrag!=null?String(x.betrag).replace(".",",")+" €":"")+(x.art?", "+String(x.art).trim():"")+(x.auto?", "+x.auto:""),
  mietixSperren:x=>"Sperre "+(x.auto||"")+(x.von?" ab "+x.von.split("-").reverse().join("."):""),mietixAufgaben:x=>"Aufgabe "+(x.aufgabe||""),
  mietixZustand:x=>"Zustand "+(x.auto||"")+": "+(x.text||"")};
let burst=null,burstZeit=null;
function sicherheitsnetz(k,alt,neu){
  // Papierkorb: Einträge, die aus einer Liste verschwunden sind (nicht bei Rückgängig selbst)
  if(!rueckLaeuft){try{const c=SPEICHER[k];const ma=alsMap(k,JSON.parse(alt||"null")||(c.liste?[]:{})),mn=alsMap(k,JSON.parse(neu||"null")||(c.liste?[]:{}));
    const weg=Object.keys(ma).filter(p=>!(p in mn));
    if(weg.length){const pk=lies("mietixPapierkorb",[]),jetzt=new Date().toISOString();
      weg.forEach(p=>pk.push({id:k+":"+p+":"+Date.now(),ablage:k,schluessel:p,eintrag:ma[p],zeit:jetzt,text:(BESCHRIFTUNG[k]||(x=>NAMEN[k]+" "+p))(ma[p]||{})}));
      const grenze=new Date(Date.now()-90*864e5).toISOString();merk("mietixPapierkorb",pk.filter(x=>x.zeit>grenze));
      if(sitzung){clearTimeout(warte);warte=setTimeout(abgleichen,800)}}}catch(e){}}
  if(rueckLaeuft)return;
  // Rückgängig: Änderungen innerhalb von 0,7 Sekunden gehören zusammen (z. B. Vertrag + Kunde + Fahrzeug)
  const jetzt=Date.now();if(!burst||jetzt-burstZeit>700)burst={};burstZeit=jetzt;if(!(k in burst))burst[k]=alt;
  rueckZeigen(Object.keys(burst).map(x=>NAMEN[x]||x).filter((x,i,a)=>a.indexOf(x)===i).join(", "))}
let rueckLaeuft=false,rueckTimer=null;
function rueckZeigen(text){let el=document.getElementById("mietixRueck");
  if(!el){el=document.createElement("div");el.id="mietixRueck";el.innerHTML='<span></span><button type="button">Rückgängig</button>';document.body.appendChild(el);
    el.querySelector("button").onclick=rueckgaengig}
  el.querySelector("span").textContent="Gespeichert: "+text;el.classList.add("an");clearTimeout(rueckTimer);rueckTimer=setTimeout(()=>el.classList.remove("an"),8000)}
function rueckgaengig(){if(!burst)return;
  if("mietixVorgaenge" in burst&&!confirm("Die letzte Änderung am Vertrag wird zurückgenommen (zum Beispiel das Speichern). Was im Formular steht, bleibt stehen. Weiter?"))return;
  const b=burst;burst=null;rueckLaeuft=true;
  try{Object.keys(b).forEach(k=>{if(b[k]===null)localStorage.removeItem(k);else roh.call(localStorage,k,b[k])})}finally{rueckLaeuft=false}
  const el=document.getElementById("mietixRueck");if(el){el.querySelector("span").textContent="Zurückgeholt.";clearTimeout(rueckTimer);rueckTimer=setTimeout(()=>el.classList.remove("an"),1500)}
  window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:Object.keys(b)}));clearTimeout(warte);warte=setTimeout(abgleichen,800)}
window.mietixWiederherstellen=function(id){const pk=lies("mietixPapierkorb",[]),e=pk.find(x=>x.id===id);if(!e)return false;
  const c=SPEICHER[e.ablage];if(!c)return false;const m=alsMap(e.ablage,lies(e.ablage,c.liste?[]:{}));m[e.schluessel]=e.eintrag;
  merk("mietixPapierkorb",pk.filter(x=>x.id!==id));localStorage.setItem(e.ablage,JSON.stringify(ausMap(e.ablage,m)));
  window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:[e.ablage,"mietixPapierkorb"]}));return true};
window.mietixPapierkorb=()=>lies("mietixPapierkorb",[]).slice().sort((a,b)=>a.zeit<b.zeit?1:-1);

/* ---------- Vertragsnummer aus dem gemeinsamen Speicher ---------- */
window.mietixNeueNummer=async function(){if(!sitzung||!navigator.onLine)return null;
  try{const n=await api("rpc/neue_vertragsnummer",{method:"POST",body:"{}"});return typeof n==="string"?n:null}catch(e){return null}};
window.mietixAbgleichen=abgleichen;

/* ---------- Link aus der Einladungs- oder Passwort-Mail: Passwort selbst festlegen ---------- */
let pwSetzen=false,linkFehler="";
(function(){const h=new URLSearchParams(location.hash.slice(1));if(!h.get("access_token")&&!h.get("error"))return;
  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")){linkFehler="Der Link aus der Mail ist abgelaufen oder schon benutzt. Bitte eine neue Einladung anfordern.";return}
  sichern({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_in:+h.get("expires_in")||3600});
  pwSetzen=/invite|recovery|signup/.test(h.get("type")||"")})();

/* ---------- Anzeige: Anmeldung oder Stand ---------- */
function zeigen(){const el=document.getElementById("abgleich");if(!el)return;
  if(sitzung&&pwSetzen){el.innerHTML='<div class="abgl"><b>Passwort festlegen</b><div class="abgl-text">Für '+(sitzung.email||"dieses Konto")+'. Damit meldest du dich auf allen Geräten an, auch für die Brücke. Mindestens 8 Zeichen.</div>'+
    '<input id="ablNeu" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Neues Passwort (sichtbar, damit kein Tippfehler)">'+
    '<button id="ablSetzen" type="button">Passwort speichern</button><div class="abgl-fehler" id="ablFehler"></div></div>';
    document.getElementById("ablSetzen").onclick=async()=>{const pw=document.getElementById("ablNeu").value,f=document.getElementById("ablFehler");
      if(pw.length<8){f.textContent="Bitte mindestens 8 Zeichen.";return}
      try{const t=await token();const r=await fetch(URL_+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
        if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.message||"Speichern ging nicht")}
        pwSetzen=false;zeigen();abgleichen()}catch(e){f.textContent=e.message}};return}
  const pkt=document.getElementById("abgleichPunkt");
  if(pkt)pkt.style.background=!sitzung?"#B0B0B3":fehler?"#C4161C":"#1B8A4B";
  if(!sitzung){el.innerHTML='<div class="abgl rot"><b>Nicht angemeldet</b><div class="abgl-text">Einmal anmelden, dann ist alles gesichert.</div>'+
    '<input id="ablMail" type="email" inputmode="email" autocomplete="username" placeholder="E-Mail">'+
    '<input id="ablPw" type="password" autocomplete="current-password" placeholder="Passwort">'+
    '<button id="ablLos" type="button">Anmelden</button><div class="abgl-fehler" id="ablFehler">'+linkFehler+'</div>'+
    '<a href="#" id="ablNeuZugang" class="abgl-link">Noch keinen Zugang? Hier anlegen</a></div>';
    const mail=()=>document.getElementById("ablMail").value.trim(),pw=()=>document.getElementById("ablPw").value,f=document.getElementById("ablFehler");
    document.getElementById("ablLos").onclick=async()=>{f.textContent="";
      try{sichern(await auth("token?grant_type=password",{email:mail(),password:pw()}));
        zeigen();abgleichen()}catch(e){f.textContent=/Invalid login/i.test(e.message)?"E-Mail oder Passwort stimmt nicht.":e.message}};
    // Zugang selbst anlegen: geht nur, solange Baran die Registrierung in Supabase kurz freigibt
    document.getElementById("ablNeuZugang").onclick=async e=>{e.preventDefault();f.textContent="";
      if(!mail()||pw().length<8){f.textContent="Oben E-Mail und ein eigenes Passwort (mindestens 8 Zeichen) eintragen, dann hier tippen.";return}
      try{const j=await auth("signup",{email:mail(),password:pw()});
        if(j.access_token){sichern(j);zeigen();abgleichen()}else f.textContent="Zugang angelegt. Bitte die Mail bestätigen und dann anmelden."}
      catch(e){f.textContent=/not allowed|disabled/i.test(e.message)?"Zugang anlegen ist gerade gesperrt. Baran muss es kurz freigeben.":
        /already/i.test(e.message)?"Für diese E-Mail gibt es schon einen Zugang. Bitte oben anmelden.":e.message}};return}
  const stand=laeuft?"gleicht ab …":fehler?"nicht abgeglichen: "+fehler:zuletzt?"abgeglichen um "+String(zuletzt.getHours()).padStart(2,"0")+":"+String(zuletzt.getMinutes()).padStart(2,"0"):"wartet auf Internet";
  el.innerHTML='<div class="abgl klein"><span>Alle Geräte: '+stand+'</span><span><a href="#" id="ablPwNeu">Passwort ändern</a> &nbsp; <a href="#" id="ablAus">abmelden</a></span></div>';
  // Angemeldet: neues Passwort setzen geht ohne das alte (für "Passwort vergessen" ohne Mail, 28.10.2026)
  document.getElementById("ablPwNeu").onclick=e=>{e.preventDefault();pwSetzen=true;zeigen()};
  document.getElementById("ablAus").onclick=e=>{e.preventDefault();if(!confirm("Auf diesem Gerät abmelden? Die Daten bleiben hier."))return;
    sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}}
const css=document.createElement("style");
css.textContent=".abgl{background:#fff;border:1px solid #E4E4E7;border-radius:16px;padding:14px;margin-bottom:14px}"+
  ".abgl b{display:block;font-size:15px;margin-bottom:4px}.abgl-text{font-size:13px;color:#6F6F72;margin-bottom:8px}"+
  ".abgl input{width:100%;border:1px solid #E4E4E7;border-radius:12px;padding:12px;font-weight:600;font-size:16px;font-family:inherit;margin-top:6px;min-height:46px;box-sizing:border-box}"+
  ".abgl button{width:100%;margin-top:8px;background:#C4161C;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}"+
  ".abgl-fehler{color:#C4161C;font-size:13px;font-weight:700;margin-top:6px}"+
  ".abgl-link{display:block;text-align:center;margin-top:10px;font-size:13px;color:#6F6F72}"+
  ".abgl.klein{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6F6F72;padding:10px 14px}.abgl.klein a{color:#6F6F72}"+
  ".abgl.rot{border:2px solid #C4161C}.abgl.rot b{color:#C4161C}"+
  "#mietixRueck{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));transform:translateY(-160%);z-index:9999;background:#2E2E30;color:#fff;"+
  "border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 14px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);"+
  "transition:transform .25s;max-width:560px;margin:0 auto;white-space:nowrap}#mietixRueck span{overflow:hidden;text-overflow:ellipsis;min-width:0}"+
  "#mietixRueck.an{transform:translateY(0)}#mietixRueck span{flex:1 1 auto}"+
  "#mietixRueck button{flex:0 0 auto!important;width:auto!important;min-height:0!important;height:auto!important;margin:0!important;box-shadow:none!important;background:#C4161C!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:9px 14px!important;font:800 14px Inter,system-ui,sans-serif!important;cursor:pointer;display:inline-block!important}";
document.head.appendChild(css);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)abgleichen()});
window.addEventListener("online",abgleichen);
setInterval(abgleichen,60000);
zeigen();abgleichen();
})();
</script>
