<header><h1>MIETIX <span>PAPIERKORB</span> <i id="abgleichPunkt" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#B0B0B3;vertical-align:middle;margin-left:4px"></i></h1></header>
<main>
<div id="abgleich"></div>
<div class="hinweis">Gelöschtes liegt 90 Tage hier und kommt mit einmal Antippen zurück.</div>

<div class="bereich"><div class="kopf"><b>Zustand, erledigte Punkte</b><span id="nZustand"></span></div><div class="karte" id="zustand"></div></div>
<div class="bereich"><div class="kopf"><b>Aufgaben, erledigt (60 Tage)</b><span id="nAufgaben"></span></div><div class="karte" id="aufgaben"></div></div>
</main>
<div class="meld" id="meld"></div>
<script>
const $=id=>document.getElementById(id);
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const schreib=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const de=s=>{if(!s)return"";const d=new Date(s);if(isNaN(d))return String(s).slice(0,10).split("-").reverse().join(".");return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()+(String(s).length>10?" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"")};
function meldung(t){const m=$("meld");m.textContent=t;m.classList.add("an");clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove("an"),1800)}
function zeichne(){
  const pk=(window.mietixPapierkorb?window.mietixPapierkorb():lies("mietixPapierkorb",[]).slice().sort((a,b)=>a.zeit<b.zeit?1:-1));
  // Ein Kasten je Bereich, immer in derselben Reihenfolge, auch wenn leer
  const BEREICHE=[["mietixVorgaenge","Mietverträge"],["mietixAnfragen","Anfragen"],["mietixKunden","Kunden"],["mietixAusgaben","Ausgaben (Geld)"],["mietixSperren","Sperren (Kalender)"],["mietixZustand","Zustand (Autos)"],["mietixAufgaben","Aufgaben"]];
  const extra=e=>{if(e.ablage==="mietixEntwurfVertrag")return'<span class="haken">angefangen, nicht gespeichert</span>';if(e.ablage!=="mietixVorgaenge")return"";const v=e.eintrag||{};return '<span class="haken">Mietvertrag</span>'+(v.ueb?'<span class="haken">Übergabe</span>':"")+(v.rueck?'<span class="haken">Rückgabe</span>':"")+(v.schaden?'<span class="haken">Schaden</span>':"")};
  $("geloescht").innerHTML=BEREICHE.map(([k,t])=>{const l=pk.filter(e=>e.ablage===k||(k==="mietixVorgaenge"&&e.ablage==="mietixEntwurfVertrag"));
    return '<div class="bereich"><div class="kopf"><b>'+t+'</b><span class="'+(l.length?"":"null")+'">'+l.length+'</span></div><div class="karte">'+
      (l.length?l.map(e=>'<div class="z"><div class="t"><b>'+esc(e.text)+'</b><i>'+extra(e)+(/^Andere Fassung/.test(e.text||"")?'zur Seite gelegt ':'gelöscht ')+de(e.zeit)+'</i></div><button data-pk="'+esc(e.id)+'">Wiederherstellen</button></div>').join(""):'<div class="leer">Nichts gelöscht.</div>')+'</div></div>'}).join("");
  [...$("geloescht").querySelectorAll("button[data-pk]")].forEach(b=>b.onclick=()=>{if(window.mietixWiederherstellen&&window.mietixWiederherstellen(b.dataset.pk)){meldung("Wiederhergestellt.");zeichne()}else meldung("Ging nicht. Seite neu laden und nochmal versuchen.")});
  const z=lies("mietixZustand",[]).filter(x=>x.erledigt).sort((a,b)=>(b.erledigtAm||"")<(a.erledigtAm||"")?-1:1);
  $("nZustand").textContent=z.length;$("nZustand").className=z.length?"":"null";
  $("zustand").innerHTML=z.length?z.map(x=>'<div class="z"><div class="t"><b>'+esc(x.auto)+': '+esc(x.text)+'</b><i>erledigt '+de(x.erledigtAm||x.datum)+'</i></div><button class="hell" data-z="'+esc(x.id)+'">Wiederherstellen</button></div>').join(""):'<div class="leer">Nichts erledigt.</div>';
  [...$("zustand").querySelectorAll("button[data-z]")].forEach(b=>b.onclick=()=>{const l=lies("mietixZustand",[]),x=l.find(y=>y.id===b.dataset.z);if(x){x.erledigt=false;delete x.erledigtAm;schreib("mietixZustand",l);meldung("Wiederhergestellt.");zeichne()}});
  const grenze=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
  const a=lies("mietixAufgaben",[]).filter(x=>x.erledigt&&!x._weg&&String(x.erledigt)>=grenze).sort((p,q)=>String(q.erledigt).localeCompare(String(p.erledigt)));
  $("nAufgaben").textContent=a.length;$("nAufgaben").className=a.length?"":"null";
  $("aufgaben").innerHTML=a.length?a.map(x=>'<div class="z"><div class="t"><b>'+esc(x.aufgabe)+'</b><i>erledigt '+de(x.erledigt)+'</i></div><button class="hell" data-a="'+esc(x.id)+'">Wiederherstellen</button></div>').join(""):'<div class="leer">Nichts erledigt.</div>';
  [...$("aufgaben").querySelectorAll("button[data-a]")].forEach(b=>b.onclick=()=>{const l=lies("mietixAufgaben",[]),x=l.find(y=>y.id===b.dataset.a);if(x){delete x.erledigt;x.status="Offen";schreib("mietixAufgaben",l);meldung("Wiederhergestellt.");zeichne()}});
}
zeichne();
window.addEventListener("mietix-abgleich",zeichne);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)zeichne()});
</script>
<script>/* Mietix Abgleich: Mietverträge, Anfragen, Kunden und Fahrzeuge auf allen Geräten gleich (Supabase Frankfurt, seit 26.10.2026).
   Wird von tools/vertrag/build_html.py und tools/anfragen/build_html.py in die Seite eingebaut.
   - Die Werkzeuge arbeiten weiter nur mit localStorage. Dieser Baustein merkt jede Änderung an den vier Speichern,
     schickt sie hoch und holt neue Stände der anderen Geräte (beim Start, beim Zurückkehren zur Seite, jede Minute).
   - Ohne Internet oder ohne Anmeldung läuft alles wie vorher, der Abgleich holt später nach.
   - Gelöschte Einträge (Anfragen-Buch) gehen als {_weg:true} hoch, damit sie auch auf den anderen Geräten verschwinden.
   - Anmeldung: E-Mail und Passwort, einmal pro Gerät. Gilt für alle Mietix-Werkzeuge auf barankohler.github.io. */
(function(){
const URL_="https://zbeqrwvlmiulxvhryiku.supabase.co";
const KEY="sb_publishable_LVkvpgXMpBbq_OXgwOfTqg_ZRcRkFyQ";   // öffentlich gedacht, Schutz über Anmeldung und Regeln in der Datenbank
const SPEICHER={mietixVorgaenge:{tab:"vorgaenge",pk:"nr",liste:true},mietixAnfragen:{tab:"anfragen",pk:"id",liste:true},
  mietixKunden:{tab:"kunden",pk:"name",liste:false},mietixFahrzeuge:{tab:"fahrzeuge",pk:"name",liste:false},
  mietixAusgaben:{tab:"ausgaben",pk:"id",liste:true},mietixSperren:{tab:"sperren",pk:"id",liste:true},
  mietixAufgaben:{tab:"aufgaben",pk:"id",liste:true},mietixZustand:{tab:"zustand",pk:"id",liste:true},mietixAutos:{tab:"autos",pk:"name",liste:false},mietixStand:{tab:"stand",pk:"id",liste:false},mietixPapierkorb:{tab:"papierkorb",pk:"id",liste:true}};
const roh=Storage.prototype.setItem;
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const merk=(k,v)=>{try{roh.call(localStorage,k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
let sitzung=lies("mietixSitzung",null),laeuft=false,nochmal=false,zuletzt=null,fehler="";

/* ---------- Anmeldung ---------- */
async function auth(pfad,body){const r=await fetch(URL_+"/auth/v1/"+pfad,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||"Anmeldung fehlgeschlagen");e.status=r.status;throw e}return j}
function sichern(j){sitzung={token:j.access_token,neu:j.refresh_token,bis:Date.now()+(j.expires_in||3600)*1000-60000,
  email:(j.user&&j.user.email)||(sitzung&&sitzung.email)||""};merk("mietixSitzung",sitzung)}
async function token(){if(!sitzung)return null;
  if(Date.now()>sitzung.bis){try{sichern(await auth("token?grant_type=refresh_token",{refresh_token:sitzung.neu}))}
    // Abmelden nur, wenn der Speicher die Anmeldung wirklich ablehnt, nicht bei schlechtem Netz (30.10.2026)
    catch(e){if(e.status>=400&&e.status<500){sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}return null}}
  return sitzung.token}
async function api(pfad,opt){const t=await token();if(!t)throw new Error("nicht angemeldet");
  const r=await fetch(URL_+"/rest/v1/"+pfad,Object.assign({},opt,{headers:Object.assign({apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},(opt||{}).headers||{})}));
  if(!r.ok)throw new Error("Speicher antwortet "+r.status);const s=await r.text();return s?JSON.parse(s):null}

/* ---------- Abgleich ---------- */
function alsMap(k,w){const c=SPEICHER[k],m={};if(c.liste)(w||[]).forEach(x=>{if(x&&x[c.pk]!==undefined)m[String(x[c.pk])]=x});else Object.assign(m,w||{});return m}
function ausMap(k,m){const c=SPEICHER[k];if(!c.liste)return m;return Object.keys(m).sort().map(p=>m[p])}
/* Zusammenführen statt Überschreiben (30.10.2026, Nachtschicht):
   - Erst holen, dann schicken. So kennt jedes Gerät den neuesten Stand, bevor es seinen eigenen hochlädt.
   - Je Eintrag merkt sich das Gerät, wie er beim letzten Abgleich aussah (Fingerabdruck je Feld).
     Haben beide Geräte verschiedene Felder geändert, kommen beide Änderungen zusammen.
   - Haben beide dasselbe Feld verschieden geändert, bleibt die Fassung dieses Geräts stehen und die andere
     Fassung liegt im Papierkorb ("Andere Fassung"), dort kann man sie wiederherstellen. Nichts verschwindet still.
   - Geändert schlägt Gelöscht: wird ein Eintrag hier geändert und dort gelöscht, bleibt er da.
   - Beim Holen wird zwei Minuten überlappend gefragt, damit kein Eintrag wegen ungleich gehender Uhren fehlt. */
const UEBERLAPPUNG=2*60*1000;
const FELDWEISE={mietixVorgaenge:1,mietixAnfragen:1,mietixKunden:1,mietixFahrzeuge:1,mietixAutos:1};
// Inhalt unabhängig von der Reihenfolge der Felder (die Datenbank sortiert Felder um)
const ordne=x=>Array.isArray(x)?x.map(ordne):x&&typeof x==="object"?Object.keys(x).sort().reduce((o,n)=>{o[n]=ordne(x[n]);return o},{}):x;
const fp=x=>hash(JSON.stringify(ordne(x))===undefined?"":JSON.stringify(ordne(x)));
// Fingerabdruck stimmt mit der Grundlage überein (neue Form oder die Form vor dem 30.10.2026)
const gleichBasis=(x,b)=>b!==undefined&&(fp(x)===b||hash(JSON.stringify(x))===b);
const felderVon=x=>{const f={};if(x&&typeof x==="object"&&!Array.isArray(x))Object.keys(x).forEach(n=>f[n]=fp(x[n]));return f};
function andereFassung(k,p,eintrag){if(k==="mietixPapierkorb"||k==="mietixStand")return;
  const pk=lies("mietixPapierkorb",[]),jetzt=new Date().toISOString(),c=SPEICHER[k];
  const s=fp(eintrag);if(pk.some(x=>x.ablage===k&&x.schluessel===p&&fp(x.eintrag)===s))return;
  pk.push({id:k+":"+p+":"+Date.now()+":f",ablage:k,schluessel:p,eintrag,zeit:jetzt,andere:true,
    text:"Andere Fassung: "+(BESCHRIFTUNG[k]||(x=>NAMEN[k]+" "+p))(eintrag||{})});
  merk("mietixPapierkorb",pk)}
function zusammen(k,p,lokal,server,basisHash,basisFelder){
  // Rückgabe: der Eintrag, der hier stehen soll (undefined = löschen)
  const lokalGeaendert=lokal===undefined?(basisHash!==undefined&&basisHash!=="weg"):!gleichBasis(lokal,basisHash);
  if(server&&server._weg){if(lokal===undefined)return undefined;
    if(basisHash!==undefined&&lokalGeaendert)return lokal;          // hier geändert, dort gelöscht: bleibt da
    return undefined}
  if(lokal===undefined){if(basisHash!==undefined&&basisHash!=="weg"&&gleichBasis(server,basisHash))return undefined; // hier gelöscht, dort unverändert
    return server}
  if(fp(lokal)===fp(server))return lokal;
  if(basisHash===undefined){andereFassung(k,p,lokal);return server}  // erstes Mal auf diesem Gerät: gemeinsamer Stand gilt, eigener liegt im Papierkorb
  if(!lokalGeaendert)return server;                                   // hier nichts geändert: neuer Stand gilt
  if(gleichBasis(server,basisHash))return lokal;                               // dort nichts geändert: eigener Stand bleibt
  // beide geändert
  if(FELDWEISE[k]&&basisFelder&&typeof lokal==="object"&&typeof server==="object"&&!Array.isArray(lokal)){
    const out={},namen=new Set([...Object.keys(lokal),...Object.keys(server),...Object.keys(basisFelder)]);let streit=false;
    namen.forEach(n=>{const lf=n in lokal?fp(lokal[n]):undefined,sf=n in server?fp(server[n]):undefined,bf=basisFelder[n];
      if(lf===sf){if(n in lokal)out[n]=lokal[n]}
      else if(lf===bf){if(n in server)out[n]=server[n]}
      else if(sf===bf){if(n in lokal)out[n]=lokal[n]}
      else{streit=true;if(n in lokal)out[n]=lokal[n];else if(n in server)out[n]=server[n]}});
    if(streit)andereFassung(k,p,server);
    return out}
  andereFassung(k,p,server);return lokal}
async function abgleichen(){
  if(!sitzung||!navigator.onLine)return;if(laeuft){nochmal=true;return}laeuft=true;fehler="";zeigen();
  const H=lies("mietixAbgleich",{}),geholt=[];
  try{
    for(const k of Object.keys(SPEICHER)){const c=SPEICHER[k],h=H[k]=H[k]||{zeit:"",hash:{}};if(!h.felder)h.felder={};
      // 1) runter: was die anderen Geräte geschickt haben, Eintrag für Eintrag zusammengeführt
      const ab=h.zeit?new Date(new Date(h.zeit).getTime()-UEBERLAPPUNG).toISOString():"";
      const seit=ab?"&geaendert=gt."+encodeURIComponent(ab):"";
      const zeilen=await api(c.tab+"?select="+c.pk+",daten,geaendert&order=geaendert.asc"+seit,{method:"GET"})||[];
      let anders=false;const m2=alsMap(k,lies(k,c.liste?[]:{}));
      zeilen.forEach(z=>{const p=String(z[c.pk]);if(z.geaendert>h.zeit)h.zeit=z.geaendert;
        const vorher=p in m2?JSON.stringify(m2[p]):undefined;
        const ergebnis=zusammen(k,p,m2[p],z.daten,h.hash[p],h.felder[p]);
        if(ergebnis===undefined){if(p in m2){delete m2[p];anders=true}}
        else if(JSON.stringify(ergebnis)!==vorher){m2[p]=ergebnis;anders=true}
        // Grundlage für das nächste Mal ist jetzt der gemeinsame Stand
        if(z.daten&&z.daten._weg){h.hash[p]="weg";delete h.felder[p]}
        else{h.hash[p]=fp(z.daten);if(FELDWEISE[k])h.felder[p]=felderVon(z.daten)}});
      if(anders){merk(k,ausMap(k,m2));geholt.push(k)}
      // 2) hoch: alles, was hier anders ist als der gemeinsame Stand (auch Gelöschtes)
      const m=alsMap(k,lies(k,c.liste?[]:{})),jetzt=new Date().toISOString(),hoch=[];
      Object.keys(m).forEach(p=>{if(gleichBasis(m[p],h.hash[p])){h.hash[p]=fp(m[p]);return}hoch.push({[c.pk]:p,daten:m[p],geaendert:jetzt})});
      Object.keys(h.hash).forEach(p=>{if(!(p in m)&&h.hash[p]!=="weg")hoch.push({[c.pk]:p,daten:{_weg:true},geaendert:jetzt})});
      for(let i=0;i<hoch.length;i+=200)await api(c.tab+"?on_conflict="+c.pk,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(hoch.slice(i,i+200))});
      hoch.forEach(z=>{const p=z[c.pk];if(z.daten._weg){h.hash[p]="weg";delete h.felder[p]}else{h.hash[p]=fp(z.daten);if(FELDWEISE[k])h.felder[p]=felderVon(z.daten)}});
      if(k==="mietixVorgaenge"){const max=Math.max(0,...Object.keys(m).filter(n=>/^\d{6}$/.test(n)).map(Number));
        if(max)await api("rpc/vertragsnummer_mindestens",{method:"POST",body:JSON.stringify({n:max})})}
      merk("mietixAbgleich",H)}
    zuletzt=new Date();
    if(geholt.length)window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:geholt}));
  }catch(e){fehler=e.message||"Abgleich fehlgeschlagen"}
  laeuft=false;zeigen();if(nochmal){nochmal=false;setTimeout(abgleichen,500)}}
// Jede Änderung an den vier Speichern löst kurz danach einen Abgleich aus
let warte=null;
Storage.prototype.setItem=function(k,v){const alt=(this===localStorage&&SPEICHER[k])?localStorage.getItem(k):null;roh.call(this,k,v);
  if(this===localStorage&&SPEICHER[k]){clearTimeout(warte);warte=setTimeout(abgleichen,800);if(k!=="mietixStand"&&k!=="mietixPapierkorb")sicherheitsnetz(k,alt,v)}};

/* ---------- Sicherheitsnetz (28.10.2026, Baran: "Verklicken darf nichts verlieren") ----------
   1. Rückgängig: jede Änderung an einer Ablage zeigt 8 Sekunden lang einen Knopf, der den Stand davor zurückholt.
   2. Papierkorb: was aus einer Liste verschwindet, landet in mietixPapierkorb (Tabelle papierkorb, 90 Tage) und
      kann in der Zentrale wiederhergestellt werden (window.mietixWiederherstellen).

/* Einheit fest im Zahlenfeld (31.10.2026) */
(function(){if(window.mxEinheit)return;
  const REGELN=[[/€|&euro;|\beur\b|betrag|preis|kaution|einbehalt|aufpreis|kosten|wert\b|selbstbeteiligung/i,"€"],
    [/rabatt|prozent/i,"%"],[/liter/i,"Liter"],[/profiltiefe|\bmm\b/i,"mm"],[/stück|schlüssel/i,"Stück"],[/^\s*alter\b/i,"Jahre"],
    [/kilometer|\bkm\b|freikm/i,"km"]];
  const AUS=new Set(["nr"]);   // Mietvertrag-Nummer bleibt ohne Einheit
  function beschriftung(f){let l=f.id?document.querySelector('label[for="'+f.id+'"]'):null;
    if(!l){let e=f.previousElementSibling;while(e&&!l){if(e.tagName==="LABEL")l=e;e=e.previousElementSibling}}

  function einheit(f){if(f.dataset.einheit!==undefined)return f.dataset.einheit;

    for(const n of [f.previousElementSibling,f.nextElementSibling])if(n&&n.tagName!=="LABEL"&&n.tagName!=="INPUT"&&/^\s*(€|km|%|prozent|liter|mm)/i.test(n.textContent||""))return"";

  function alle(w){(w||document).querySelectorAll('input[inputmode="decimal"],input[inputmode="numeric"],input[type="number"]').forEach(setzen)}
  window.mxEinheit=alle;alle();
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){if(n.matches&&n.matches("input"))setzen(n);else if(n.querySelectorAll)alle(n)}})
