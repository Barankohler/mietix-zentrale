    const LK={q:norm(st.q),w:Object.assign({},st.w||{}),roh:st.q||""};let bau=false,zeileT="";
    (o.felder||[]).forEach(f=>{if(f.frei==="nur"&&LK.w[f.k]&&!freiTeile(LK.w[f.k]))delete LK.w[f.k]});
    const merke=()=>{try{sessionStorage.setItem(K,JSON.stringify({q:LK.roh,w:LK.w}))}catch(e){}};
    const host=()=>document.getElementById(hostId);
    const felderZeigen=()=>{(o.felder||[]).forEach(f=>{const el=host().querySelector('[data-lk="'+f.k+'"]');if(!el)return;const v=LK.w[f.k]||"",p=(f.werte()||[]).find(x=>x[0]===v);
      el.querySelector("b").textContent=v?(freiTeile(v)?freiText(v):f.monate?monText(v):p?p[1]:v):f.alle;el.classList.toggle("gew",!!v)})};
    // Gewählter Zeitraum mit Uhrzeit in der Trefferzeile, auf allen Geräten gleich (10.11.2026, Baran)
    const zeitZusatz=()=>(o.felder||[]).filter(f=>f.frei&&freiTeile(LK.w[f.k])).map(f=>freiLang(LK.w[f.k])).join(", ");
    const zeileZeigen=()=>{const z=host().querySelector(".lkZeile");if(!z)return;const zz=zeitZusatz();z.innerHTML='<span>'+esc(zeileT+(zz?", "+zz:""))+'</span>'+(LK.aktiv()?'<a role="button" tabindex="0">Filter zurücksetzen</a>':"");
      const a=z.querySelector("a");if(a)a.onclick=()=>{LK.roh="";LK.q="";LK.w={};merke();const i=host().querySelector("input");if(i)i.value="";kreuz();felderZeigen();o.neu()}};
    const kreuz=()=>{const k=host().querySelector(".lkSuche button");if(k)k.style.display=LK.roh?"":"none"};
    LK.aktiv=()=>!!LK.q||Object.keys(LK.w).some(k=>LK.w[k]);
    LK.passt=t=>{if(!LK.q)return true;const h=norm(t);return LK.q.split(" ").every(x=>h.includes(x))};
    LK.zeile=t=>{zeileT=t;zeileZeigen()};
    LK.bauen=()=>{const h=host();if(!h)return LK;if(!bau||!h.firstChild){bau=true;h.innerHTML='<div class="lkKopf"><label class="lkSuche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" autocomplete="off" placeholder="'+esc(o.suche||"Suchen")+'" aria-label="Suchen"><button type="button" aria-label="Suche leeren">✕</button></label>'+
        ((o.felder||[]).length?'<div class="lkFelder">'+o.felder.map(f=>'<div class="lkFeld" role="button" tabindex="0" data-lk="'+f.k+'"><span><small>'+esc(f.t)+'</small><b></b></span><em>›</em></div>').join("")+'</div>':"")+'<div class="lkZeile"></div></div>';
      const i=h.querySelector("input");i.value=LK.roh;i.addEventListener("input",()=>{LK.roh=i.value;LK.q=norm(i.value);merke();kreuz();o.neu()});
      h.querySelector(".lkSuche button").onclick=e=>{e.preventDefault();i.value="";LK.roh="";LK.q="";merke();kreuz();o.neu();i.focus()};kreuz();
      (o.felder||[]).forEach(f=>{h.querySelector('[data-lk="'+f.k+'"]').onclick=()=>{const nimm=w=>{if(w)LK.w[f.k]=w;else delete LK.w[f.k];merke();felderZeigen();o.neu()};if(f.monate){monatBlatt(f.t,f.monate==="alle",f.alle,(f.werte()||[]).map(x=>x[0]),LK.w[f.k]||"",nimm);return}blatt(f.t,[["",f.alle]].concat(f.werte()||[]),LK.w[f.k]||"",w=>{if(w)LK.w[f.k]=w;else delete LK.w[f.k];merke();felderZeigen();o.neu()},f.frei)}})}
      felderZeigen();zeileZeigen();return LK};
    return LK};
  const tag=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  window.mxListenkopf.zeit=[["heute","Heute"],["woche","Diese Woche"],["naechsteW","Nächste Woche"],["monat","Dieser Monat"],["vormonat","Letzter Monat"],["naechsterM","Nächster Monat"],["jahr","Dieses Jahr"]];
  window.mxListenkopf.freiText=freiText;window.mxListenkopf.freiLang=freiLang;window.mxListenkopf.monatWahl=monatBlatt;   // Monat und Jahr auch ohne Filterfeld: monatWahl(titel,false,"",[datenMonate],"JJJJ-MM",w=>…), leer = aktueller Monat
  /* Liegt eine Miete im Zeitraum? Bei von/bis mit Uhrzeit minutengenau, bei den festen Knöpfen wie bisher nach Tagen */
  window.mxListenkopf.ueberlappt=function(w,vd,vu,bd,bu){const s=window.mxListenkopf.spanne(w);if(!s)return true;
    if(freiTeile(w)){const an=vd?vd+"T"+(vu||"00:00"):"",en=(bd||vd)?(bd||vd)+"T"+(bu||"23:59"):"";return an<=s[1]&&en>=s[0]}
    return String(vd||"")<=s[1]&&String(bd||vd||"")>=s[0]};
  window.mxListenkopf.spanne=function(w){const p=freiTeile(w);if(p)return[p.vd?p.vd+"T"+p.vu:"0000-01-01T00:00",p.bd?p.bd+"T"+p.bu:"9999-12-31T23:59"];const n=new Date(),j=n.getFullYear(),m=n.getMonth(),mo=new Date(j,m,n.getDate()-((n.getDay()+6)%7));
    const pl=(d,x)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+x);
    return{heute:[tag(n),tag(n)],woche:[tag(mo),tag(pl(mo,6))],naechsteW:[tag(pl(mo,7)),tag(pl(mo,13))],monat:[tag(new Date(j,m,1)),tag(new Date(j,m+1,0))],vormonat:[tag(new Date(j,m-1,1)),tag(new Date(j,m,0))],naechsterM:[tag(new Date(j,m+1,1)),tag(new Date(j,m+2,0))],jahr:[j+"-01-01",j+"-12-31"]}[w]||null};
})();
</script>

<script>
const $=id=>document.getElementById(id);
const AUTOS=[{"n": "Audi RS Q8", "anzeige": "Audi RS Q8", "kaution": 1950}, {"n": "Audi RS 5 ABT", "anzeige": "Audi RS 5 ABT", "kaution": 1450}, {"n": "Audi RS 3 Limousine", "anzeige": "Audi RS 3 Limousine", "kaution": 1450}, {"n": "Golf 8 GTI Clubsport", "anzeige": "VW Golf 8 GTI Clubsport", "kaution": 1000}, {"n": "Audi RS 6", "anzeige": "Audi RS 6", "kaution": 1950}, {"n": "GLC 63 S AMG", "anzeige": "Mercedes GLC 63 S AMG", "kaution": 1450}, {"n": "C 63 S AMG", "anzeige": "Mercedes C 63 S AMG", "kaution": 1450}, {"n": "Audi R8 performance", "anzeige": "Audi R8 performance", "kaution": 2500}, {"n": "Golf 8 2.0 Diesel", "anzeige": "VW Golf 8 2.0 Diesel", "kaution": 1000}, {"n": "Mercedes-Benz S580L AMG Chauffeur-Paket", "anzeige": "Mercedes-Benz S580L AMG Chauffeur-Paket", "kaution": 1950}, {"n": "BMW M 850i", "anzeige": "BMW M 850i", "kaution": 1450}];   // aus der Preisdatei beim Bauen: Name, Anzeige, Kaution
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const HEUTE=()=>iso(new Date()),plusTage=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const de=s=>{s=String(s||"");const m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+"."+m[2]+"."+m[1]:s};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const kurz=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1).replace(/[\s,;:]+\S*$/,"")+" …":s};
const zahl=v=>{if(typeof v==="number")return v;let t=String(v==null?"":v).replace(/[^\d,.\-]/g,"");if(!t)return NaN;
  t=t.includes(",")?t.replace(/\./g,"").replace(",","."):(/^\d{1,3}(\.\d{3})+$/.test(t)?t.replace(/\./g,""):t);return parseFloat(t)};
const EUR=n=>{const r=Math.round((+n||0)*100)/100;return r.toLocaleString("de-DE",{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})+" €"};
const EUR0=n=>Math.round(+n||0).toLocaleString("de-DE")+" €";
const lies=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}};
function schreib(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){if(window.mxFehler)mxFehler("Nicht gespeichert: Der Speicher auf diesem Gerät ist voll.");else alert("Nicht gespeichert: Der Speicher auf diesem Gerät ist voll.");return false}}
const ROH=Storage.prototype.setItem;   // vor abgleich.js geholt: schreibt die Einnahme einer Zahlung ohne dessen zweiten Rückgängig-Knopf
function schreibStill(k,v){try{ROH.call(localStorage,k,JSON.stringify(v));setTimeout(()=>{if(window.mietixAbgleichen)window.mietixAbgleichen()},60);return true}
  catch(e){if(window.mxFehler)mxFehler("Nicht gespeichert: Der Speicher auf diesem Gerät ist voll.");else alert("Nicht gespeichert: Der Speicher auf diesem Gerät ist voll.");return false}}
function meldung(t){const m=$("meld");m.textContent=t;m.classList.add("an");clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove("an"),2200)}
const ICH=()=>{try{return((JSON.parse(localStorage.getItem("mietixSitzung")||"null")||{}).email||"").toLowerCase()}catch(e){return""}};
// Namen vergleichbar machen wie die Brücke (forderungen.dreh): Reihenfolge, Umlaute und Klammerzusatz egal
const dreh=s=>((String(s||"").toLowerCase().replace(/\(.*?\)/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").match(/[a-z0-9]+/g))||[]).sort().join(" ");

/* ---------- Fälle ---------- */
const BELEGE=[["mietvertrag","Mietvertrag"],["uebergabe","Übergabe-Protokoll"],["rueckgabe","Rückgabe-Protokoll"],["anerkannt","Schaden anerkannt"],["kv","Kostenvoranschlag"],["rechnung","Rechnung"],["fotosVorher","Fotos vorher"],["fotosNachher","Fotos nachher"]];
const BWORT={"da":"Da","fehlt":"Fehlt","korrektur":"Korrektur","nicht nötig":"Nicht nötig"},BKL={"da":"da","fehlt":"fehlt","korrektur":"korrektur","nicht nötig":"nicht"};
const BNEXT={"da":"fehlt","fehlt":"nicht nötig","nicht nötig":"da","korrektur":"da"};
const GRUPPEN=[["holen","Noch zu holen"],["klaeren","Erst klären"],["antworten","Nur antworten"]];
const STATI=["Offen","Gemahnt","Inkasso","Bestritten","Anwalt Gegenseite","Gericht"];
const ST=()=>lies("mietixStand",{})||{};
function FAELLE(){const k=ST().kundenschaeden,f=k&&k.faelle&&typeof k.faelle==="object"?k.faelle:{};
  return Object.keys(f).map(id=>Object.assign({},f[id],{id})).filter(x=>x&&!x._weg&&x.name)}
// Zahlungen (17.11.2026, Befund der Prüfer): stehen nur als Einnahme auf der Seite Geld (Feld schaden = Kennung des Falls), nicht im Fall.
// So geht keine Zahlung verloren, wenn zwei Handys gleichzeitig am selben Fall etwas ändern. Ältere Zahlungen im Fall (zahlungen) zählen mit.
let EIN=[];
const holeEin=()=>(EIN=(lies("mietixAusgaben",[])||[]).filter(x=>x&&!x._weg&&x.rein&&x.schaden));
const zahlListe=f=>(f.zahlungen||[]).map(z=>({am:z.am,betrag:+z.betrag||0,art:z.art||""})).concat(EIN.filter(x=>x.schaden===f.id).map(x=>({am:x.datum,betrag:+x.betrag||0,art:x.zahlart||"",id:x.id})));
const zahlungen=f=>zahlListe(f).reduce((s,z)=>s+z.betrag,0);
const ohneBetrag=f=>!f.erledigt&&(f.forderung==null||f.forderung==="");
const rest=f=>Math.round(((+f.forderung||0)-(+f.bezahlt||0)-zahlungen(f))*100)/100;
const offen=f=>f.erledigt||ohneBetrag(f)?0:Math.max(0,rest(f));
const sonstBezahlt=f=>Math.max(0,Math.round(((+f.bezahlt||0)-(f.einbehalten!=null&&f.einbehalten!==""?+f.einbehalten:0))*100)/100);
const fehlen=f=>BELEGE.filter(([k])=>{const v=(f.belege||{})[k]||"fehlt";return v==="fehlt"||v==="korrektur"});
const zaehlt=f=>!f.erledigt&&f.gruppe!=="antworten";   // wie die Drive-Liste: Noch zu holen und Erst klären
// Frist: erstes Datum im Text wie in der Drive-Liste, Klammern zählen nicht (Anerkenntnis …); „keine“ ist keine Frist
const fristText=f=>/^\s*(keine?|-)?\s*$/i.test(String(f.frist||""))?"":String(f.frist);
function fristD(f){const m=fristText(f).replace(/\([^)]*\)/g," ").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]):""}
function sortiert(l){const bald=plusTage(7),r=f=>{const d=fristD(f);return d&&d<=bald?"0"+d:"1"+String(1e10-Math.round(offen(f)*100)).padStart(12,"0")};
  return l.slice().sort((a,b)=>r(a)<r(b)?-1:r(a)>r(b)?1:String(a.name).localeCompare(String(b.name),"de"))}
// Auto so, wie die Seite Geld es kennt (Anzeige-Name aus der Preisdatei)
const autoAnz=n=>{const s=String(n||"");const a=AUTOS.find(x=>x.n===s||x.anzeige===s)||AUTOS.find(x=>s&&(s.startsWith(x.anzeige||x.n)||s.startsWith(x.n)));return a?(a.anzeige||a.n):""};
// Fall beim eigenen Anwalt, vor Gericht oder bestritten: keine Abrechnung anbieten (Regel „Keine Angriffsfläche“)
const beimAnwalt=f=>/\bRA\b|Anwalt|Mandat|Gericht|bestreit|Widerspruch|Chargeback|Nexi|Inkasso|Creditreform/i.test([f.inkasso,f.schritt,f.hinweis,f.frist].join(" "));

/* Mietverträge mit Schadensanerkennung, die noch nicht als Fall da sind. Fälle mit Vertragsnummer zählen nur über die Nummer, Fälle ohne
   Nummer über den Namen, wenn das Datum passt (Befund der Prüfer: sonst fehlte der neue Schaden eines Stammkunden mit einem alten Fall). */
const nrAus=t=>(String(t||"").match(/\d{5,6}/)||[""])[0];
function gedeckt(x,alle){const sd=String(x.schaden.datum).slice(0,10);
  return alle.some(f=>{const nrs=[f.vertrag,nrAus(f.mvNr)].filter(Boolean);if(nrs.length)return nrs.includes(x.nr);
    const fd=String(f.datum||f.rueckgabe||"").slice(0,10);return dreh(f.name)===dreh(x.name)&&!!fd&&Math.abs(new Date(fd)-new Date(sd))<=31*864e5})}
function neueAusVertraegen(alle){const v=lies("mietixVorgaenge",[])||[];
  return v.filter(x=>x&&!x._weg&&x.schaden&&x.schaden.datum&&(x.schaden.sb||x.schaden.betrag||x.schaden.besch||x.schaden.art)&&!gedeckt(x,alle))
    .sort((a,b)=>String(b.schaden.datum).localeCompare(String(a.schaden.datum)))}

/* ---------- Liste ---------- */
const LK=mxListenkopf("lk","schaeden",{suche:"Name oder Auto",felder:[{k:"stand",t:"Stand",alle:"Alle offenen",werte:()=>[["holen","Noch zu holen"],["klaeren","Erst klären"],["antworten","Nur antworten"],["belege","Belege fehlen"],["erledigt","Erledigt"]]}],neu:()=>zeichne()});
function zeile(f){const o=offen(f),fe=fehlen(f),h=HEUTE(),fd=fristD(f),vorbei=fd&&fd<h,bald=fd&&!vorbei&&fd<=plusTage(7),r=rest(f);
  const betrag=f.erledigt?(r>0?'<b class="grau">'+EUR(r)+' offen gelassen</b>':'<b class="gruen">Bezahlt</b>'):ohneBetrag(f)?'<b class="gelb">Betrag fehlt</b>':'<b class="'+(o<=0?"grau":f.gruppe==="holen"?"rot":"dunkel")+'">'+EUR(o)+'</b>';
  const kau=f.einbehalten==null||f.einbehalten===""?"Kaution nicht belegt":+f.einbehalten>0?"Kaution "+EUR(f.einbehalten)+" behalten":"keine Kaution";
